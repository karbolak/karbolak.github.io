<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A product demo for the PSAG Platform, built for the Polish Student Association Groningen.">
  <title>PSAG Platform Demo · Kajetan Karbowski</title>
  <link rel="stylesheet" href="portfolio.css?v=cv-abstract-7">
  <link rel="stylesheet" href="experiment.css?v=cv-abstract-7">
  <style>
    .demo-shell { width: min(100%, 1200px); margin-inline: auto; }
    .demo-nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 6px 20px;
      padding: 8px 2px 18px;
      color: var(--accent);
      font: 500 .88rem/1.5 var(--prose);
    }
    .demo-nav a { padding-block: 6px; }
    [data-theme="dark"] .demo-nav { color: #fff; }
    .demo-hero, .demo-walkthrough, .demo-contact {
      font: 400 1.05rem/1.55 var(--prose);
    }
    .demo-hero {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      padding: clamp(30px, 7vw, 108px) clamp(23px, 6vw, 88px);
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--panel);
    }
    .demo-hero::before {
      content: '';
      position: absolute;
      z-index: -1;
      inset: 0 0 0 46%;
      background:
        radial-gradient(circle, var(--accent) .7px, transparent 1.2px) 0 0 / 8px 8px,
        linear-gradient(130deg, transparent, var(--accent-wash));
      mask-image: radial-gradient(ellipse at 100% 65%, black, transparent 75%);
      opacity: .7;
    }
    .demo-shell .demo-hero h1 {
      margin-block: 10px 12px;
      font-family: var(--prose);
      font-weight: 650;
      font-size: clamp(2.8rem, 8.5vw, 7.1rem);
      line-height: .97;
    }
    .demo-type { color: var(--accent); font: 550 .85rem/1.4 var(--prose); }
    .demo-hero .demo-lead { max-width: 36ch; font-size: clamp(1.1rem, 2.2vw, 1.55rem); color: var(--muted); }
    .demo-cta {
      display: inline-flex;
      gap: 10px;
      align-items: center;
      padding: 11px 16px;
      border-radius: 8px;
      background: var(--accent);
      color: var(--panel);
      font: 600 .88rem/1.4 var(--prose);
      text-decoration: none;
    }
    .demo-cta:hover { text-decoration: underline; }
    .demo-hero .demo-cta { margin-top: 24px; }
    .demo-walkthrough { padding: clamp(24px, 5vw, 66px) 0; scroll-margin-top: 20px; }
    .demo-shell :is(.demo-walkthrough, .demo-contact) h2 {
      margin-bottom: 8px;
      font: 650 clamp(1.45rem, 3vw, 2.35rem)/1.15 var(--prose);
      letter-spacing: -.025em;
    }
    .demo-stage {
      display: grid;
      place-items: center;
      min-height: clamp(160px, 36vw, 360px);
      margin-top: 17px;
      padding: 24px;
      border: 1px dashed var(--control-line);
      border-radius: 14px;
      background: var(--raised);
      color: var(--muted);
      text-align: center;
    }
    .demo-contact {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px 20px;
      margin-bottom: 16px;
      padding: clamp(18px, 3.5vw, 36px);
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--accent-wash);
    }
    .demo-contact h2 { margin: 0; }
  </style>
</head>
<body>
  <div class="portfolio" data-design="experimental" data-theme="light">
    <div class="demo-shell">
      <nav class="demo-nav" aria-label="Return links">
        <a href="./?section=projects&amp;project=psag" data-portfolio-link><span aria-hidden="true">←</span> Back to project</a>
        <a href="./" data-portfolio-link>Back to home</a>
      </nav>
      <main>
        <header class="demo-hero">
          <p class="demo-type">Product demo</p>
          <h1>PSAG Platform</h1>
          <p class="demo-lead">A digital platform developed for the Polish Student Association Groningen.</p>
          <a class="demo-cta" href="#walkthrough">See the walkthrough <span aria-hidden="true">↓</span></a>
        </header>
        <section class="demo-walkthrough" id="walkthrough" aria-labelledby="walkthrough-title">
          <h2 id="walkthrough-title">Product walkthrough</h2>
          <!-- Replace the demo stage with screenshots, a video, or a step-by-step walkthrough. -->
          <div class="demo-stage"><p>Screenshots and a guided walkthrough are coming.</p></div>
        </section>
        <section class="demo-contact" aria-labelledby="demo-contact-title">
          <h2 id="demo-contact-title">Interested in the platform?</h2>
          <a class="demo-cta" href="./?section=contact" data-portfolio-link>Get in touch <span aria-hidden="true">→</span></a>
        </section>
      </main>
    </div>
  </div>
  <script>
    const preferences = new URLSearchParams(location.search);
    if (preferences.get('theme') === 'dark') document.querySelector('.portfolio').dataset.theme = 'dark';
    for (const link of document.querySelectorAll('[data-portfolio-link]')) {
      const destination = new URL(link.href);
      for (const key of ['role', 'theme', 'photo']) {
        if (preferences.has(key)) destination.searchParams.set(key, preferences.get(key));
      }
      link.href = destination;
    }
  </script>
</body>
</html>
